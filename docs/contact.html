<main class="doc">
  <div class="glow gold" style="width:560px;height:560px;top:-260px;inset-inline-start:-200px"></div>

    <span class="pill blue" data-i="nav.contact">Contact</span>
    <h1 style="margin-top:16px" data-i="contact.title"></h1>
    <p class="intro" data-i="contact.sub"></p>
    <div class="contact-grid">
      <aside class="c-info rv">
        <h3 data-i="contact.directTitle"></h3>
        <p data-i="contact.direct"></p>
        <a class="mail" href="mailto:ozgurcocuk9@gmail.com"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 7l9 6 9-6"/></svg>ozgurcocuk9@gmail.com</a>
        <ul id="c-list"></ul>
      </aside>
      <form class="cform rv d1">
        <input class="hp" type="text" name="_honey" tabindex="-1" autocomplete="off">
        <div class="frow">
          <div class="field"><label for="name" data-i="contact.name"></label><input id="name" name="name" required autocomplete="name"></div>
          <div class="field"><label for="email" data-i="contact.email"></label><input id="email" name="email" type="email" required autocomplete="email"></div>
        </div>
        <div class="frow">
          <div class="field"><label for="topic" data-i="contact.topic"></label><select id="topic" name="topic"></select></div>
          <div class="field"><label for="device" data-i="contact.device"></label><input id="device" name="device" data-ph="contact.devicePh"></div>
        </div>
        <div class="field"><label for="message" data-i="contact.message"></label><textarea id="message" name="message" required data-ph="contact.messagePh"></textarea></div>
        <p class="fnote" data-ih="contact.privacy"></p>
        <div id="fstatus" class="fstatus hidden"></div>
        <button class="btn btn-gold" type="submit" data-i="contact.send"></button>
      </form>
    </div>
  </div>
